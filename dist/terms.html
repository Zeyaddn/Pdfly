<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFly — شروط الاستخدام | Terms of Service</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <link rel="stylesheet" crossorigin href="/assets/styles-YwZGikJk.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="/logo.png" alt="PDFly Logo" class="logo-img">
        <span class="font-latin logo-brand-text">PDFly</span>
      </a>
      <div class="header-controls">
        <a href="/" class="btn btn-secondary">
          <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
          <span>الرئيسية</span>
        </a>
      </div>
    </div>
  </header>
  <main class="container section" style="padding-top:calc(var(--header-height) + 40px);max-width:800px;">
    <div style="background:var(--bg-elevated);padding:var(--space-8);border-radius:var(--radius-lg);border:1px solid var(--border-primary);">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;color:var(--accent);">
        <i data-lucide="file-check" style="width:36px;height:36px;"></i>
        <h1 style="font-size:1.8rem;margin:0;">شروط الاستخدام</h1>
      </div>
      <p style="font-size:1.1rem;line-height:1.8;color:var(--text-secondary);margin-bottom:20px;">
        منصة PDFly متاحة للاستخدام المباشر لجميع الأفراد والمؤسسات لتسهيل إدارة المستندات وتعديلها وتحويلها دون قيود خوادم.
      </p>
      <div style="display:grid;gap:16px;margin:24px 0;">
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <i data-lucide="check" style="width:20px;height:20px;color:var(--success);flex-shrink:0;margin-top:4px;"></i>
          <span>جميع الأدوات تعمل محلياً على مسؤولية المستخدم الخاصة بمعالجة ملفاته.</span>
        </div>
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <i data-lucide="check" style="width:20px;height:20px;color:var(--success);flex-shrink:0;margin-top:4px;"></i>
          <span>لا تحتفظ المنصة بأي نسخ من الملفات أو البيانات الشخصية إطلاقاً.</span>
        </div>
      </div>
      <div style="margin-top:30px;">
        <a href="/" class="btn btn-primary">
          <i data-lucide="layout-grid" style="width:18px;height:18px;"></i>
          <span>العودة للأدوات</span>
        </a>
      </div>
    </div>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', () => { if (window.lucide) window.lucide.createIcons(); });
  </script>
</body>
</html>
